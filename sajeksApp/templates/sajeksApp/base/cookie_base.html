{% load static %}

<div id="cookie-consent-banner" class="cookie-banner" style="display: none;">
    <div class="container d-flex justify-content-between align-items-center">
        <p class="mb-0">
            🍪 This site uses cookies to enhance user experience and analyze traffic. By clicking "Accept," you consent to our use of cookies.
        </p>
        <button id="accept-cookies-btn" class="btn btn-sm btn-success flex-shrink-0 ms-3">
            Accept
        </button>
    </div>
</div>

<script>
    // --- Helper Functions (Contained within this script) ---
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
    }

    function setCookie(name, value, days) {
        const d = new Date();
        d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
        const expires = "expires=" + d.toUTCString();
        // IMPORTANT: Set SameSite=Lax for modern browsers
        document.cookie = `${name}=${value}; ${expires}; path=/; SameSite=Lax`;
    }

    // --- Main Consent Initialization Logic ---
    document.addEventListener('DOMContentLoaded', function() {
        const banner = document.getElementById('cookie-consent-banner');
        const acceptBtn = document.getElementById('accept-cookies-btn');
        const consentCookieName = 'cookie_consent_given'; // Use a new, unique name

        // Check if the consent cookie exists
        const consentGiven = getCookie(consentCookieName);

        // Debugging logs - Check your console!
        console.log("Cookie Consent Script (Inline) Initialized.");
        console.log("Consent Status:", consentGiven ? 'Given' : 'Not Given');

        if (!consentGiven && banner) {
            // Show the banner if consent is NOT given and the element exists
            console.log("Displaying cookie consent banner.");
            banner.style.display = 'block'; // Make it visible

            if (acceptBtn) {
                acceptBtn.addEventListener('click', function() {
                    console.log("Accept button clicked. Setting consent cookie.");

                    // 1. Set the consent cookie for 90 days
                    setCookie(consentCookieName, 'true', 90);

                    // 2. Hide the banner
                    banner.style.display = 'none';
                    
                    // 3. OPTIONAL: If testimonial logic needs to start now, 
                    //    you would call the startTestimonialLogic() function here.
                    //    Since we're separating the two, we'll keep this clean.
                });
            }
        }
        // If consent is given, the banner remains hidden due to the inline style="display: none;"
    });
</script>
