    <!-- About Section -->
    <section id="about" class="about section">

      <div class="content">
        <div class="container">
          <div class="row">
            <div class="col-lg-6 mb-4 mb-lg-0">
              <img src="{{choosepix.pic.url}}" alt="Image " class="img-fluid img-overlap" data-aos="zoom-out">
            </div>
            <div class="col-lg-5 ml-auto" data-aos="fade-up" data-aos-delay="100">
              <h3 class="content-subtitle text-white opacity-50">Why Choose Us</h3>
              <h2 class="content-title mb-4">
                {{choosepix.title|safe}}
              </h2>
              <p class="opacity-50">
                {{choosepix.body|safe}}
              </p>

              <div class="row my-5">
                {% for choose in chooses %}
                <div class="col-lg-12 d-flex align-items-start mb-4">
                  {% comment %} <i class="bi bi-cloud-rain me-4 display-6"></i> {% endcomment %}
                  {{ choose.icon | safe}}
                  <div>
                    <h4 class="m-0 h5 text-white">{{ choose.title| safe }}</h4>
                    <p class="text-white opacity-50">{{ choose.body | safe }}</p>
                  </div>
                </div>
                {% endfor %}
                
              </div>
            </div>
          </div>
        </div>
      </div>
    </section><!-- /About Section -->
